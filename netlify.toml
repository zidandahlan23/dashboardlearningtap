[build]
command = "yarn build"
publish = "dist"

[functions]
directory = "netlify/functions"

[build.environment]
NODE_VERSION = "20.19.5"
NETLIFY_USE_YARN = "true"
YARN_VERSION = "1.22.22"
YARN_FLAGS = "--ignore-engines --network-timeout 100000"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
